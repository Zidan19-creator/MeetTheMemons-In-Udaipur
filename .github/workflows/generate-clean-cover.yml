name: Build final hero cover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-clean-cover.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Composite correct Bismillah onto clean Monday cover
        run: |
          python - <<'PY'
          from PIL import Image, ImageEnhance

          base_path = "assets/cover-final-hq.webp"
          bis_path = "assets/bismillah-correct.png"
          out_path = "assets/cover-final-bismillah-hq.webp"

          base = Image.open(base_path).convert("RGBA")
          bis = Image.open(bis_path).convert("RGBA")

          # Keep the exact supplied calligraphy; only scale it.
          target_w = 440
          target_h = round(bis.height * target_w / bis.width)
          bis = bis.resize((target_w, target_h), Image.Resampling.LANCZOS)

          # Darken very slightly so it matches the invitation artwork.
          rgb = ImageEnhance.Brightness(bis.convert("RGB")).enhance(0.82)
          rgb.putalpha(bis.getchannel("A"))
          bis = rgb

          x = (base.width - target_w) // 2
          y = 94
          base.alpha_composite(bis, (x, y))

          base.convert("RGB").save(out_path, "WEBP", quality=95, method=6)
          print(f"Generated {out_path} at {base.width}x{base.height}; Bismillah {target_w}x{target_h} at ({x},{y})")
          PY

      - name: Commit final hero cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cover-final-bismillah-hq.webp
          git diff --cached --quiet && exit 0
          git commit -m "Bake correct Bismillah into final hero cover"
          git push
