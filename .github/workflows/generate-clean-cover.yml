name: Generate final wedding cover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-clean-cover.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --quiet pillow numpy opencv-python-headless

      - name: Build corrected clean cover
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import numpy as np, cv2, os

          src = "assets/cover-hq.webp"
          out = "assets/cover-final-hq.webp"

          base = np.array(Image.open(src).convert("RGB"))

          # 1) Remove only the baked-in Bismillah from the otherwise clean sky.
          mask = np.zeros(base.shape[:2], dtype=np.uint8)
          mask[85:155, 335:690] = 255
          bgr = cv2.cvtColor(base, cv2.COLOR_RGB2BGR)
          cleaned = cv2.inpaint(bgr, mask, 7, cv2.INPAINT_TELEA)
          rgb = cv2.cvtColor(cleaned, cv2.COLOR_BGR2RGB)

          # 2) Remove the old Sunday date line only.
          mask2 = np.zeros(rgb.shape[:2], dtype=np.uint8)
          mask2[732:785, 195:830] = 255
          bgr2 = cv2.cvtColor(rgb, cv2.COLOR_RGB2BGR)
          cleaned2 = cv2.inpaint(bgr2, mask2, 7, cv2.INPAINT_TELEA)
          rgb2 = cv2.cvtColor(cleaned2, cv2.COLOR_BGR2RGB)

          im = Image.fromarray(rgb2)
          draw = ImageDraw.Draw(im)
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 26)

          text = "MONDAY, 4TH JANUARY 2027"
          tracking = 5.7
          widths = [draw.textlength(ch, font=font) for ch in text]
          total = sum(widths) + tracking * (len(text) - 1)
          x = (im.width - total) / 2
          y = 743
          for ch, cw in zip(text, widths):
              draw.text((x, y), ch, font=font, fill=(62, 50, 39))
              x += cw + tracking

          im.save(out, "WEBP", quality=95, method=6)
          print(f"Generated {out}")
          PY

      - name: Commit final cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cover-final-hq.webp
          git diff --cached --quiet && exit 0
          git commit -m "Generate clean Monday cover"
          git push
